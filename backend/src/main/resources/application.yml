spring:
  application:
    name: presence-relecture
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:presence_relecture}
    username: ${DB_USER:presence_relecture}
    password: ${DB_PASSWORD:presence_relecture}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
