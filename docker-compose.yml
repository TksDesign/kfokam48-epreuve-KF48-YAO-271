services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: presence_relecture
      POSTGRES_USER: presence_relecture
      POSTGRES_PASSWORD: presence_relecture
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presence_relecture"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: presence_relecture
      DB_USER: presence_relecture
      DB_PASSWORD: presence_relecture
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # frontend: ajoute une fois le Dockerfile React pret (antigravity)

volumes:
  db_data:
